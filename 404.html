<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, follow">
    <title>Página no encontrada | Capilla Santa Ana</title>
    <meta name="description" content="La página que buscás no existe o fue movida. Volvé al inicio de la Capilla Santa Ana.">
    <link rel="icon" type="image/svg+xml" href="icono.svg">
    <link rel="icon" type="image/png" href="icono.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5D4037">

    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">

    <style>
        :root {
            --primario: #5D4037; --acento: #966F3F; --fondo: #F5F5F0; --blanco: #FFFFFF; --texto: #2D2D2D;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--fondo); color: var(--texto);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 40px 20px;
        }
        h1, h2 { font-family: 'Playfair Display', serif; color: var(--primario); }
        .cruz { font-size: 3rem; color: var(--acento); margin-bottom: 20px; }
        h1 { font-size: 2.4rem; margin-bottom: 10px; }
        p { max-width: 480px; line-height: 1.7; margin: 0 auto 30px; opacity: 0.85; }
        .actions { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 28px; border-radius: 50px; text-decoration: none;
            font-weight: 700; font-size: 0.95rem; transition: transform 0.3s;
        }
        .btn:hover { transform: translateY(-3px); }
        .btn-primary { background: var(--primario); color: white; }
        .btn-secondary { background: var(--blanco); color: var(--primario); border: 2px solid var(--primario); }
    </style>
</head>
<body>
    <div class="cruz"><i class="fas fa-cross"></i></div>
    <h1>No encontramos esta página</h1>
    <p>Puede que el enlace esté roto o que la página se haya movido. Volvé al inicio o escribinos si creés que esto es un error.</p>
    <div class="actions">
        <a href="/index.html" class="btn btn-primary"><i class="fas fa-home"></i> Ir al inicio</a>
        <a href="/profundiza/index.html" class="btn btn-secondary"><i class="fas fa-book-open"></i> Profundizá tu fe</a>
    </div>
    <script src="/sw-register.js" defer></script>
</body>
</html>
