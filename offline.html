<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, follow">
    <title>Sin conexión | Capilla Santa Ana</title>
    <link rel="icon" type="image/svg+xml" href="icono.svg">
    <link rel="icon" type="image/png" href="icono.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5D4037">
    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <style>
        :root { --primario: #5D4037; --acento: #966F3F; --fondo: #F5F5F0; --blanco: #FFFFFF; --texto: #2D2D2D; }
        @media (prefers-color-scheme: dark) {
            :root { --primario: #E0C097; --acento: #D4A373; --fondo: #121212; --blanco: #1E1E1E; --texto: #E0E0E0; }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: var(--fondo); color: var(--texto); min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .offline-box { max-width: 420px; }
        .offline-icon { font-size: 4rem; color: var(--acento); margin-bottom: 20px; }
        h1 { font-family: 'Playfair Display', serif; color: var(--primario); font-size: 1.8rem; margin-bottom: 15px; }
        p { font-size: 1.05rem; opacity: 0.85; margin-bottom: 30px; line-height: 1.6; }
        .btn-retry { display: inline-flex; align-items: center; gap: 10px; padding: 14px 32px; border-radius: 50px; background: var(--acento); color: #fff; text-decoration: none; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; border: none; cursor: pointer; }
        .btn-retry:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="offline-box">
        <div class="offline-icon"><i class="fas fa-cross"></i></div>
        <h1>Sin conexión</h1>
        <p>No pudimos cargar esta página porque no hay conexión a internet. Revisá tu señal y volvé a intentar — las páginas que ya visitaste pueden seguir disponibles.</p>
        <button class="btn-retry" onclick="window.location.reload()"><i class="fas fa-rotate-right"></i> Reintentar</button>
    </div>
</body>
</html>
